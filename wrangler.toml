# Cloudflare Pages — static frontend (Vite `dist/`).
# API stays on Render/Docker (Playwright); do not deploy `server/` as a Worker.
#
# ── Git-connected Pages (Dashboard) ──────────────────────────────────
# Build command:          npm run build
# Build output directory: dist
# Deploy command:         (leave EMPTY)
#   Do NOT set "npx wrangler deploy" — that is for Workers and will fail.
#   Pages uploads `dist` automatically after a successful build.
#
# Environment variables (Production, build-time):
#   VITE_API_BASE, VITE_PLAYBACK, VITE_BANGUMI_*, VITE_ANILIST_*
#
# ── Local / CLI deploy ───────────────────────────────────────────────
#   npm run build
#   npx wrangler pages deploy dist --project-name=mioani

name = "mioani"
compatibility_date = "2025-07-28"
pages_build_output_dir = "dist"
