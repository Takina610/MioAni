# Cloudflare Pages — frontend only (Vite dist).
# API stays on Render/Docker (Playwright); do not deploy server/ as a Worker.
#
# Deploy:
#   npm run build
#   npx wrangler pages deploy dist --project-name=mioani
# Or with this file (output dir must match pages_build_output_dir):
#   npx wrangler pages deploy
#
# Build-time env (Dashboard → Pages → Settings → Environment variables):
#   VITE_API_BASE, VITE_PLAYBACK, VITE_BANGUMI_*, VITE_ANILIST_*

name = "mioani"
compatibility_date = "2025-07-28"
pages_build_output_dir = "dist"
