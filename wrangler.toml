# Cloudflare Workers static frontend deploy (dist after `npm run build`)
# Same pattern as miss/soramiss.
# Dashboard form:
#   构建命令: npm run build
#   部署命令: npx wrangler deploy
#
# NOTE: Express API in /server is NOT deployed by this file (Playwright stays on Render).
# Set build env VITE_API_BASE=https://your-api.example.com/api on Cloudflare.

name = "mioani"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "./dist"
# SPA fallback for Vue Router (do NOT also ship public/_redirects — Workers rejects that loop)
not_found_handling = "single-page-application"
# Avoid auto-trailing-slash rewriting that can fight SPA asset rules
html_handling = "none"
