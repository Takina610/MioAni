      <rect x="68" y="188" width="96" height="8" rx="3" fill="rgba(143,151,145,0.25)"/>
      <text x="190" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#8f9791">Upcoming</text>
