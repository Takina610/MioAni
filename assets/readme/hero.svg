<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MioAni - Follow your season</title>
  <desc id="desc">Browse seasonal anime, sync Bangumi and AniList watchlists, and manage progress in a local library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d0c"/>
      <stop offset="55%" stop-color="#101411"/>
      <stop offset="100%" stop-color="#151a16"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d0c" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#0b0d0c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b0d0c" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3528"/>
      <stop offset="100%" stop-color="#141914"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243028"/>
      <stop offset="100%" stop-color="#101510"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="380" rx="26"/>
    </clipPath>
