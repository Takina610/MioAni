      <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="72" font-weight="700" fill="#f2f5f1" letter-spacing="-1.5">MioAni</text>
      <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="500" fill="#b8f05f">Follow your season.</text>
      <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#8f9791">浏览季度新番 · 同步 Bangumi / AniList</text>
      <text x="0" y="216" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#8f9791">本地追番库管理进度 · 可选多源播放</text>
      <g transform="translate(0 258)">
